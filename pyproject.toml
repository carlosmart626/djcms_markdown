[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djcms_markdown"
version = "0.3.0"
description = "Ghost Markdown Editor for Django CMS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carlos Martínez", email = "carlosmart626@gmail.com" },
]
keywords = ["django", "djangocms", "markdown", "ghost"]
dependencies = [
    "django-cms>=5.1",
    "django-easymde>=1.0.4",
    "mistune>=3.0",
    "packaging>=23",
    "Pygments>=2.17",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/CarlosMart626/djcms_markdown"
Source = "https://github.com/CarlosMart626/djcms_markdown"

[tool.setuptools.packages.find]
include = ["djcms_markdown*"]

[tool.setuptools.package-data]
djcms_markdown = ["templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
